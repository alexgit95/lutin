<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Personnes')}"></head>
<body>
<header th:replace="~{fragments :: barre}"></header>
<main class="page">
    <nav th:replace="~{fragments :: onglets(${listeId}, 'personnes', false)}"></nav>
    <div th:replace="~{fragments :: messages}"></div>
    <section class="panneau">
        <h1>Personnes</h1>
        <form th:action="@{/listes/{id}/personnes(id=${listeId})}" method="post" class="ligne">
            <input type="text" name="nom" placeholder="Nom" maxlength="100" required>
            <input type="number" name="budget" placeholder="Budget (€)" min="0" step="0.01">
            <button type="submit">Ajouter</button>
        </form>
        <p class="vide" th:if="${#lists.isEmpty(personnes)}">Aucune personne.</p>
        <ul class="personnes">
            <li th:each="p : ${personnes}">
                <span th:text="${p.nom()}">Maman</span>
                <b><span th:replace="~{fragments :: montant(${p.budget()})}"></span></b>
                <span class="mini">
                    <a th:href="@{/listes/{id}/cadeaux/nouveau(id=${listeId},personneId=${p.id()})}">+ cadeau</a>
                    <a th:href="@{/listes/{id}/personnes/{pid}/modifier(id=${listeId},pid=${p.id()})}">modifier</a>
                    <form th:action="@{/listes/{id}/personnes/{pid}/supprimer(id=${listeId},pid=${p.id()})}" method="post" class="inline"
                          onsubmit="return confirm('Supprimer cette personne et tous ses cadeaux ?')">
                        <button type="submit" class="lien danger">supprimer</button>
                    </form>
                </span>
            </li>
        </ul>
    </section>
</main>
</body>
</html>
