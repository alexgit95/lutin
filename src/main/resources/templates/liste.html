<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${vue.nom()})}"></head>
<body>
<header th:replace="~{fragments :: barre}"></header>
<main class="page dashboard">
<nav th:replace="~{fragments :: onglets(${vue.id()}, 'dashboard', ${vue.lecteur()})}"></nav>
<div id="contenu" th:fragment="contenu">
    <div th:replace="~{fragments :: messages}"></div>

    <div class="entete">
        <h1 th:text="${vue.nom()}">Liste</h1>
        <span class="badge" th:if="${vue.lecteur()}">Lecture seule · liste de <b th:text="${vue.proprietaire()}">alice</b></span>
        <div class="actions" th:unless="${vue.lecteur()}">
            <a class="bouton" th:href="@{/listes/{id}/cadeaux/nouveau(id=${vue.id()})}">+ Cadeau</a>
        </div>
    </div>

    <section class="kpis">
        <div class="kpi rose"><span>Budget global</span><strong><span th:replace="~{fragments :: montant(${vue.budgetGlobal()})}"></span></strong></div>
        <div class="kpi orange"><span>Déjà déboursé</span><strong><span th:replace="~{fragments :: montant(${vue.debourse()})}"></span></strong></div>
        <div class="kpi vert"><span>Reste à payer</span><strong><span th:replace="~{fragments :: montant(${vue.resteAPayer()})}"></span></strong></div>
        <div class="kpi violet"><span>Cadeaux</span><strong th:text="${vue.totalCadeaux()}">0</strong></div>
    </section>

    <th:block th:unless="${vue.lecteur()}">
        <section th:replace="~{liste-fragments :: alertesRemboursement(${vue}, false)}"></section>
        <section th:replace="~{liste-fragments :: carteRemboursement(${vue}, false)}"></section>
    </th:block>

    <section class="panneau">
        <h2>Cadeaux</h2>
        <div class="tags">
            <a th:href="${vue.filtreARembourser()} ? @{/listes/{id}(id=${vue.id()},aRembourser=true)} : @{/listes/{id}(id=${vue.id()})}" th:class="${vue.tagActif() == null} ? 'tag actif' : 'tag'">Tous</a>
            <a th:each="t : ${vue.tags()}" th:href="${vue.filtreARembourser()} ? @{/listes/{id}(id=${vue.id()},tag=${t.id()},aRembourser=true)} : @{/listes/{id}(id=${vue.id()},tag=${t.id()})}"
               th:class="${vue.tagActif() == t.id()} ? 'tag actif' : 'tag'" th:text="${t.nom()}">tag</a>
            <a th:unless="${vue.lecteur()}" th:href="${vue.filtreARembourser()} ? @{/listes/{id}(id=${vue.id()},tag=${vue.tagActif()})} : @{/listes/{id}(id=${vue.id()},tag=${vue.tagActif()},aRembourser=true)}"
               th:class="${vue.filtreARembourser()} ? 'tag actif' : 'tag'">À rembourser</a>
            <form th:unless="${vue.lecteur()}" th:action="@{/listes/{id}/tags(id=${vue.id()})}" method="post" class="inline">
                <input type="text" name="nom" placeholder="Nouveau tag" maxlength="50" class="petit" required>
            </form>
        </div>
        <p class="vide" th:if="${#lists.isEmpty(vue.cadeaux())}">Aucun cadeau.</p>
        <div id="cadeaux" class="cadeaux">
            <th:block th:replace="~{liste-fragments :: cadeauxLot(${lot}, ${statuts})}"></th:block>
        </div>
    </section>
</div>
<nav th:replace="~{liste-fragments :: barreWorkflow(${vue}, ${statuts}, false)}"></nav>
</main>
</body>
</html>
