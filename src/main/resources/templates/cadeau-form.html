<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Cadeau')}"></head>
<body>
<header th:replace="~{fragments :: barre}"></header>
<main class="page etroit">
    <h1 th:text="${cadeauId == null} ? 'Nouveau cadeau' : 'Modifier le cadeau'">Cadeau</h1>
    <div th:replace="~{fragments :: messages}"></div>
    <form th:object="${form}" method="post"
          th:action="${cadeauId == null} ? @{/listes/{id}/cadeaux(id=${listeId})} : @{/listes/{id}/cadeaux/{cid}(id=${listeId},cid=${cadeauId})}">
        <label>Nom <small>(facultatif si une URL est indiquée : le titre de la page sera utilisé)</small>
            <input type="text" th:field="*{nom}" maxlength="255">
        </label>
        <label>URL
            <input type="url" th:field="*{url}" maxlength="2048" placeholder="https://...">
        </label>
        <label>Prix (€)
            <input type="number" th:field="*{prix}" min="0" step="0.01">
        </label>
        <label>Destinataire
            <select th:field="*{personneId}" required>
                <option value="">— choisir —</option>
                <option th:each="p : ${personnes}" th:value="${p.id()}" th:text="${p.nom()}">Maman</option>
            </select>
        </label>
        <fieldset th:unless="${#lists.isEmpty(tags)}">
            <legend>Tags</legend>
            <label class="case" th:each="t : ${tags}">
                <input type="checkbox" th:field="*{tagIds}" th:value="${t.id()}"> <span th:text="${t.nom()}">tag</span>
            </label>
        </fieldset>
        <label class="case"><input type="checkbox" th:field="*{masque}"> Masqué pour les lecteurs du partage</label>
        <label class="case"><input type="checkbox" th:field="*{pourTiers}"> Acheté pour le compte d'un tiers (exclu des budgets)</label>
        <div class="ligne">
            <button type="submit">Enregistrer</button>
            <a class="bouton clair" th:href="@{/listes/{id}(id=${listeId})}">Annuler</a>
        </div>
    </form>
</main>
</body>
</html>
