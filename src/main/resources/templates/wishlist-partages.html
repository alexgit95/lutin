<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Partage')}"></head>
<body>
<header th:replace="~{fragments :: barre}"></header>
<main class="page etroit">
    <nav th:replace="~{fragments :: ongletsWishlist(${wishlistId}, 'partages')}"></nav>
    <h1>Partager la wishlist</h1>
    <p>Les personnes ci-dessous peuvent consulter la wishlist et cocher les articles qu'elles offrent. Vous ne verrez pas ce qui est coché.</p>
    <div th:replace="~{fragments :: messages}"></div>
    <form th:action="@{/wishlists/{id}/partages(id=${wishlistId})}" method="post" class="ligne">
        <select name="lecteur" required>
            <option value="">— choisir un utilisateur —</option>
            <option th:each="c : ${candidats}" th:value="${c}" th:text="${c}">bob</option>
        </select>
        <button type="submit">Partager</button>
    </form>
    <p class="vide" th:if="${#lists.isEmpty(partages)}">Cette wishlist n'est partagée avec personne.</p>
    <ul class="personnes">
        <li th:each="p : ${partages}">
            <span th:text="${p.lecteur()}">bob</span>
            <form th:action="@{/wishlists/{id}/partages/{pid}/retirer(id=${wishlistId},pid=${p.id()})}" method="post" class="inline">
                <button type="submit" class="lien danger">retirer</button>
            </form>
        </li>
    </ul>
</main>
</body>
</html>
