<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Administration')}"></head>
<body class="auth">
<main class="card">
    <h1>Administration</h1>
    <th:block th:if="${modeCloudflare}">
        <p>Aucune fonction d'administration disponible pour l'instant.</p>
        <p>Les adresses autorisées sont gérées dans Cloudflare Access.</p>
    </th:block>
    <th:block th:unless="${modeCloudflare}">
        <p>Clé d'invitation actuelle (variable d'environnement <code>INVITATION_KEY</code>) :</p>
        <p><code id="invitation-key" th:text="${invitationKey}"></code></p>
    </th:block>
    <p><a th:href="@{/}">Retour</a></p>
</main>
</body>
</html>
