<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titre)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titre} + ' - Lutin'">Lutin</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="manifest" th:href="@{/manifest.webmanifest}" crossorigin="use-credentials">
    <link rel="apple-touch-icon" th:href="@{/icons/icon-192.png}">
    <meta name="theme-color" content="#5a55e8">
    <script th:src="@{/js/htmx.min.js}" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>
<header class="topbar" th:fragment="barre">
    <a class="brand" th:href="@{/}">Lutin</a>
    <nav>
        <a th:href="@{/listes}">Mes listes</a>
        <a th:href="@{/wishlists}">Wishlists<span class="badge" th:if="${nombreAvis != null and nombreAvis > 0}" th:text="${nombreAvis}">2</span></a>
        <a th:if="${estAdmin}" th:href="@{/admin}">Admin</a>
        <form th:action="@{/logout}" method="post" class="inline">
            <button type="submit" class="lien" th:text="'Déconnexion (' + ${utilisateurCourant} + ')'">Déconnexion</button>
        </form>
    </nav>
</header>
<nav class="onglets" th:fragment="onglets(listeId, actif, lecteur)">
    <a th:href="@{/listes/{id}(id=${listeId})}" th:classappend="${actif == 'dashboard'} ? 'actif'">Dashboard</a>
    <a th:unless="${lecteur}" th:href="@{/listes/{id}/personnes(id=${listeId})}" th:classappend="${actif == 'personnes'} ? 'actif'">Personnes</a>
    <a th:unless="${lecteur}" th:href="@{/listes/{id}/remboursements(id=${listeId})}" th:classappend="${actif == 'remboursement'} ? 'actif'">Remboursement<span th:replace="~{fragments :: badgeRemboursement(${alertesRemboursement}, false)}"></span></a>
    <a th:unless="${lecteur}" th:href="@{/listes/{id}/partages(id=${listeId})}" th:classappend="${actif == 'partages'} ? 'actif'">Partage</a>
    <a th:unless="${lecteur}" th:href="@{/listes/{id}/reglages(id=${listeId})}" th:classappend="${actif == 'reglages'} ? 'actif'">Réglages</a>
</nav>
<nav class="onglets" th:fragment="ongletsWishlist(wishlistId, actif)">
    <a th:href="@{/wishlists/{id}(id=${wishlistId})}" th:classappend="${actif == 'articles'} ? 'actif'">Articles</a>
    <a th:href="@{/wishlists/{id}/partages(id=${wishlistId})}" th:classappend="${actif == 'partages'} ? 'actif'">Partage</a>
    <a th:href="@{/wishlists/{id}/reglages(id=${wishlistId})}" th:classappend="${actif == 'reglages'} ? 'actif'">Réglages</a>
</nav>
<div th:fragment="messages">
    <p class="erreur bandeau" th:if="${erreur}" th:text="${erreur}"></p>
    <p class="info" th:if="${info}" th:text="${info}"></p>
</div>
<span th:fragment="badgeRemboursement(nombre, oob)" id="badge-remboursement" class="badge"
      th:hidden="${nombre == null or nombre == 0}" th:text="${nombre}"
      th:attr="hx-swap-oob=${oob ? 'outerHTML' : null}">0</span>
<span th:fragment="montant(valeur)" th:text="${valeur == null ? '—' : #numbers.formatDecimal(valeur, 1, 'WHITESPACE', 2, 'COMMA') + ' €'}"></span>
</body>
</html>
