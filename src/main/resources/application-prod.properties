spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Authentification par Cloudflare Access : pas de formulaire de connexion ni de clé d'invitation
lutin.acces.mode=cloudflare
lutin.cloudflare.team-domain=${CF_ACCESS_TEAM_DOMAIN}
lutin.cloudflare.audience=${CF_ACCESS_AUD}
lutin.cloudflare.email-hmac-secret=${EMAIL_HMAC_SECRET}
lutin.invitation-key=${INVITATION_KEY:}

# HTTPS terminé par Cloudflare : l'application voit du HTTP et lit X-Forwarded-*
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
